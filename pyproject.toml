[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextpulse"
version = "1.2.3"
description = "Turn your Git history into a human story"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Nathanael Linder" },
]
keywords = ["git", "cli", "report", "changelog", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "gitpython>=3.1",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/truth-against-lies/context-pulse"
Issues = "https://github.com/truth-against-lies/context-pulse/issues"

[project.scripts]
pulse = "contextpulse.main:main"
